name: Sync CDH Commands

on:
  workflow_dispatch:
  schedule: 
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-cdh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ground repository
        uses: actions/checkout@v4

      - name: Checkout CDH repository
        uses: actions/checkout@v4
        with: 
          repository: UWCubeSat/HS2-CDH
          path: cdh
          ssh-key: ${{ secrets.CDH }}
          ref: main
          submodules: false
          persist-credentials: false

      - name: Initialize CDH submodules
        working-directory: cdh
        run: git submodule update --init --recursive lib/fprime lib/fprime-geometry-types

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install CDH dependencies
        working-directory: cdh
        run: pip install -r requirements.txt
      
      - name: Generate CDH build
        working-directory: cdh
        run: fprime-util generate

      - name: Build CDH commands
        working-directory: cdh
        run: fprime-util build

      - name: Find CDH dictionary
        working-directory: cdh
        run: ls -l build-artifacts/Linux/FlightComputer/dict/FlightComputerTopologyDictionary.json

      - name: Install F Prime XTCE converter
        run: pip install fprime-xtce==0.1.5

      - name: Convert Fprime dictionary to XTCE
        run: fprime-to-xtce cdh/build-artifacts/Linux/FlightComputer/dict/FlightComputerTopologyDictionary.json -o src/main/yamcs/commands/commands.xml

      - name: Validate CDH commands
        run: python src/main/python/validate_xtce.py --input src/main/yamcs/commands/commands.xml --verbose

      - name: Upload CDH XTCE artifact
        uses: actions/upload-artifact@v4
        with: 
          name: hs2-cdh-xtce
          path: src/main/yamcs/commands/commands.xml
          if-no-files-found: error

      - name: Create PR for generated CDH commands
        # https://github.com/peter-evans/create-pull-request/tree/v7/
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Sync generated CDH commands"
          branch: automation/sync-cdh-commands
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: |
            src/main/yamcs/commands/commands.xml
          title: "chore: Sync generated CDH commands"
          body: |
            ## Summary
            Automatically synchronize the generated F´ XTCE command definitions
            from the HS2-CDH repository into HS2-Ground-Mission-Control.

            ## Changes
            - Generate commands.xml from the latest HS2-CDH dictionary.
            - Validate the generated XTCE.
            - Update src/main/yamcs/commands/commands.xml.

            ## Validation
            - F' dictionary generation and build completed.
            - XTCE converter validation completed.
            - XTCE validation script completed.

            Generated automatically by the Sync CDH Commands workflow.
