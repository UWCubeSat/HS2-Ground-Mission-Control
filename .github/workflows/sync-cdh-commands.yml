name: Sync CDH Commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-cdh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ground repository
        uses: actions/checkout@v4

      - name: Checkout CDH repository
        uses: actions/checkout@v4
        with: 
          repository: UWCubeSat/HS2-CDH
          path: cdh
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install CDH dependencies
        working-directory: cdh
        run: pip install -r requirements.txt
      
      - name: Generate CDH build
        working-directory: cdh
        run: fprime-util generate

      - name: Build CDH commands
        working-directory: cdh
        run: fprime-util build

      - name: Find CDH dictionary
        working-directory: cdh
        run: ls -l build-artifacts/Linux/FlightComputer/dict/FlightComputerTopologyDictionary.json

      - name: Convert Fprime dictionary to XTCE
        run: python src/main/python/fprime_to_xtce.py --input cdh/build-artifacts/Linux/FlightComputer/dict/FlightComputerTopologyDictionary.json --output src/main/yamcs/commands/commands.xml --validate --verbose

      - name: Validate CDH commands
        run: python src/main/python/validate_xtce.py --input src/main/yamcs/commands/commands.xml --verbose

      - name: Upload CDH XTCE artifact
        uses: actions/upload-artifact@v4
        with: 
          name: hs2-cdh-xtce
          path: src/main/yamcs/commands/commands.xml
          if-no-files-found: error
