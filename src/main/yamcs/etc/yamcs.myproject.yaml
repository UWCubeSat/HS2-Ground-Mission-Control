services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService

dataLinks:
  # - name: udp-in
  #   class: org.yamcs.tctm.UdpTmDataLink
  #   stream: tm_realtime
  #   port: 10015
  #   packetPreprocessorClassName: com.example.myproject.MyPacketPreprocessor
  #   packetPreprocessorArgs:
  #     timestampOffset: -1
  #     seqCountOffset: 2
  #     byteOrder: BIG_ENDIAN

  # - name: udp-out
  #   class: org.yamcs.tctm.UdpTcDataLink
  #   stream: tc_realtime
  #   host: localhost
  #   port: 10025
  #   commandPostprocessorClassName: com.example.myproject.MyCommandPostprocessor

  # F Prime flight computer. Each MQTT message is one complete CCSDS space packet; TC/TM transfer
  # frames are not handled here.
  - name: fprime
    class: org.yamcs.mqtt.MqttPacketLink
    brokers:
      - tcp://127.0.0.1:1883
    tmTopic: fprime-tm
    tcTopic: fprime-tc
    tmStream: tm_realtime
    tcStream: tc_realtime
    packetPreprocessorClassName: com.example.myproject.FprimePacketPreprocessor
    commandPostprocessorClassName: com.example.myproject.FprimeCommandPostprocessor

  # hs2-sim running the real flight software (sil-fprime bench), telemetry only. It runs F Prime's
  # SimDeployment, whose channel IDs differ from FlightComputer's, so it has its own topic and stream.
  # Start it with: --downlink-mqtt 127.0.0.1:1883 --downlink-mqtt-topic hs2-sim-tm
  - name: hs2-sim
    class: org.yamcs.mqtt.MqttPacketLink
    brokers:
      - tcp://127.0.0.1:1883
    tmTopic: hs2-sim-tm
    tmStream: tm_hs2sim
    packetPreprocessorClassName: com.example.myproject.FprimePacketPreprocessor

  # MQTT simulator (mqtt_simulator.py), telemetry only. It reuses APID 1, which F Prime assigns to
  # telemetry channels, so it must stay on its own stream.
  - name: simulator
    class: org.yamcs.mqtt.MqttPacketLink
    brokers:
      - tcp://127.0.0.1:1883
    tmTopic: yamcs-tm
    tmStream: tm_simulator
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: -1
      seqCountOffset: 2
    # other MQTT options
    # other link options

    # relevant info for connecting to leafspace:
    # https://docs.yamcs.org/yamcs-mqtt/links/packet/

mdb:
  # Configuration of the active loaders
  # Valid loaders are: sheet, xtce or fully qualified name of the class
  - type: xtce
    spec: mdb/xtce.xml
  - type: xtce
    spec: mdb/hs2_mission.xml
  - type: xtce
    spec: commands/commands.xml
  # Generated from hs2-sim's SimDeployment dictionary.
  - type: xtce
    spec: commands/sim.xml

# Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
      # Generated by fprime-xtce; selects the F Prime container by APID and packet ID.
      rootContainer: "/FlightComputer_FlightComputer/CCSDSSpacePacket"
    - name: "tm_hs2sim"
      processor: "realtime"
      rootContainer: "/SimDeployment_SimDeployment/CCSDSSpacePacket"
    - name: "tm_simulator"
      processor: "realtime"
      # The MQTT simulator emits the 22-byte HS2 housekeeping layout (APID 1),
      # so decode with the HS2 container. /myproject/CCSDSPacket only yields the
      # /myproject/Spacecraft params for APID 100 packets from the Yamcs example sim.
      rootContainer: "/HS2/HS2HousekeepingPacket"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
      # sim.xml also defines commands; only flight commands may reach the fprime link.
      tcPatterns: ["/FlightComputer_FlightComputer/.*"]
